# Deploys the site to Vercel from GitHub Actions with the Vercel CLI (git auto-deploy is disabled in
# vercel.json). Called by ci.yml after the whole CI gate passed on the same commit (preview on pull
# requests, production on pushes to main) and runnable by hand (workflow_dispatch, which GitHub only
# offers once this file exists on the default branch).
#
# Flow: vercel pull -> vercel build -> (production) migrations -> vercel deploy --prebuilt ->
# smoke (curl health, Playwright @smoke) -> (production) vercel promote. A production deployment is
# staged (--skip-domain) and promoted only when the smoke run passed, so a broken build never
# replaces the live site; that staging is the rollback story.
#
# Secrets (repository secrets; docs/CI-CD.md): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
# DATABASE_URL_OWNER (production), HAULCAST_APP_DB_PASSWORD (production bootstrap),
# VERCEL_AUTOMATION_BYPASS_SECRET (smoke runs against protected deployments).
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment, preview or production
        required: true
        type: string
    outputs:
      url:
        description: URL of the deployment this run created (empty when the deployment was skipped)
        value: ${{ jobs.deploy.outputs.url }}
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

# Never cancel a deployment half-way (production runs migrations); queue the next one instead.
concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # `production` carries the protection rules (required reviewers) that Ahmed configures once,
    # see docs/BRANCH-PROTECTION.md. `preview` is an unprotected environment.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check the deployment prerequisites
        id: guard
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
        run: |
          case "$ENVIRONMENT" in preview | production) ;; *) echo "::error::Unknown environment '$ENVIRONMENT'"; exit 1 ;; esac
          required=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID)
          if [ "$ENVIRONMENT" = production ]; then required+=(DATABASE_URL_OWNER); fi
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ "$ENVIRONMENT" = production ]; then
            echo "::error title=Production deployment cannot run::Missing repository secrets: ${missing[*]} (docs/CI-CD.md)"
            exit 1
          fi
          echo "::warning title=Preview deployment skipped::Missing repository secrets: ${missing[*]} (docs/CI-CD.md)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        if: ${{ steps.guard.outputs.enabled == 'true' }}
      - uses: ./.github/actions/setup-frontend
        if: ${{ steps.guard.outputs.enabled == 'true' }}

      - name: Install the Vercel CLI (pinned)
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        run: npm install --global vercel@64.7.0

      - name: Pull the Vercel project settings and environment variables
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"

      - name: Build the deployment output
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/vercel-build.sh "$ENVIRONMENT"

      - name: Bootstrap the database and apply the migrations (production only, before promoting)
        if: ${{ steps.guard.outputs.enabled == 'true' && inputs.environment == 'production' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_OWNER }}
          HAULCAST_APP_DB_PASSWORD: ${{ secrets.HAULCAST_APP_DB_PASSWORD }}
        run: bash scripts/migrate-database.sh

      - name: Deploy the prebuilt output
        id: deploy
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          flags=(--prebuilt --token="$VERCEL_TOKEN")
          if [ "$ENVIRONMENT" = production ]; then flags+=(--prod --skip-domain); fi
          url="$(vercel deploy "${flags[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $ENVIRONMENT build of $GITHUB_SHA to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the API (health and readiness)
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          args=(--fail --silent --show-error --location --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors)
          if [ -n "$BYPASS_SECRET" ]; then args+=(--header "x-vercel-protection-bypass: $BYPASS_SECRET"); fi
          curl "${args[@]}" "$DEPLOYMENT_URL/api/v1/health" | jq -e '.status == "ok"'
          curl "${args[@]}" --output /dev/null "$DEPLOYMENT_URL/api/v1/health/ready"

      - name: Install Playwright (chromium)
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test the site (Playwright @smoke against the deployment)
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm e2e --project=chromium --grep @smoke

      - name: Upload the smoke report
        if: ${{ failure() && steps.guard.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ inputs.environment }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Promote the staged deployment to production
        if: ${{ steps.guard.outputs.enabled == 'true' && inputs.environment == 'production' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Explain the state after a failed production run
        if: ${{ failure() && inputs.environment == 'production' }}
        run: |
          {
            echo "### Production was not changed by this run"
            echo "The staged deployment failed its smoke tests (or an earlier step) before promotion, so the live site"
            echo "still serves the previous deployment. Migrations may already be applied: they must stay"
            echo "backward compatible with the live version (expand, then contract). To roll back an already"
            echo "promoted deployment run: vercel rollback <deployment-url> --token <token>."
          } >> "$GITHUB_STEP_SUMMARY"
