    steps:
      - name: The probe tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tool
      - name: The commit to measure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
          path: src
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - name: Install the locked frontend dependencies
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: src/frontend
        run: pnpm build
      - name: Measure
        working-directory: src/frontend
        env:
          SHA: ${{ matrix.sha }}
        run: |
          set -o pipefail
          node --version
          mkdir -p "$RUNNER_TEMP/out"
          node ../../tool/.github/probe-b2/measure.mjs build/client/assets "$RUNNER_TEMP/out/m-$SHA.json" | tee "$RUNNER_TEMP/out/line-$SHA.txt"
          echo "### $SHA: $(cat "$RUNNER_TEMP/out/line-$SHA.txt")" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m-${{ matrix.sha }}
          path: ${{ runner.temp }}/out
          retention-days: 7
