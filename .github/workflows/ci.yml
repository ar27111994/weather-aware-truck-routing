# Required checks for every pull request and for pushes to the integration branch and main.
# Pipeline graph, secrets and what runs where: docs/CI-CD.md. Every action is pinned to a full commit
# SHA (the comment names the release); jobs get the least privilege they need.
name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
      - feat/weather-aware-routing
  workflow_dispatch:

# One run per ref: a newer push cancels the superseded run (and with it the deployment behind it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Lint the title with the repository commitlint config
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --yes --package @commitlint/cli@21.2.4 commitlint --config commitlint.config.mjs

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as the Supabase project (decision D-10): bump both together.
        image: postgres:17
        env:
          # Ephemeral container reachable only from this job's runner: trust auth mirrors the local
          # dev database and keeps any password literal out of the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest --cov --cov-branch --cov-fail-under=100
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          { echo "### Backend coverage (line + branch)"; echo; uv run coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      # Wall-clock budgets (10k assessments < 200 ms, checkpoints on a 20k-point path < 100 ms) run
      # in their own step, without coverage tracing (it slows Python several-fold); -rP prints the
      # measured times.
      - run: uv run pytest -m perf -rP

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Frontend coverage"; echo
            echo "| Statements | Branches | Functions | Lines |"; echo "|---|---|---|---|"
            jq -r '.total | "| \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build

  openapi:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: bash scripts/openapi.sh check

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: pixel-7, browser: chromium }
          - { project: iphone-14, browser: webkit }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the browser and its system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps "$BROWSER"
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
      - name: Run the end-to-end suite
        env:
          PROJECT: ${{ matrix.project }}
        run: pnpm e2e --project="$PROJECT"
      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  vercel:
    name: Vercel config and build dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - name: Test the build tooling
        run: uv run --no-project --with pytest python -m pytest scripts/tests -q -p no:cacheprovider
      - name: Validate vercel.json (official schema and project invariants)
        run: uv run --no-project --with jsonschema python scripts/check_vercel_config.py
      - name: Check that api/requirements.txt matches uv.lock
        run: |
          uv export --project backend --no-dev --frozen --no-emit-project -o api/requirements.txt
          git diff --exit-code -- api/requirements.txt
      - name: Install the Vercel CLI (pinned)
        run: npm install --global vercel@64.7.0
      - name: Build the deployment output (no Vercel account needed) and verify it
        run: bash scripts/vercel-build.sh dry-run

  # One required check that stands for the whole pipeline.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [pr-title, backend, frontend, openapi, e2e, vercel]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job passed (pr-title is skipped outside pull requests)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A required job ended as '$result'"; exit 1 ;;
            esac
          done

  deploy-preview:
    name: Preview deployment
    needs: [gate]
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
    secrets: inherit
    permissions:
      contents: read

  deploy-production:
    name: Production deployment
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
    permissions:
      contents: read
