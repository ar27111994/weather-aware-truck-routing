# Weekly, grouped dependency updates. Pull-request titles follow Conventional Commits so they pass
# the PR-title check (build(deps): ..., ci(deps): ...). A group of several updates is titled
# `<prefix>: bump the <group> group in <directory> with <n> updates` (or `across <k> directories`), so
# the group names are short: scripts/tests/commitlint-config.test.mjs works out the longest title of
# each group (two digits for <n> and <k>) and holds it to 72 characters. A title that names ONE
# dependency is as long as its name and is let past by commitlint.config.mjs.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    commit-message:
      prefix: build(deps)
    groups:
      py-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, frontend]
    commit-message:
      prefix: build(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  # Hook revisions of .pre-commit-config.yaml (ecosystem `pre-commit`, listed on docs.github.com under
  # "Dependabot supported ecosystems and repositories"). pre-commit itself is the pip entry below.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: build(deps)
    groups:
      pre-commit-hooks:
        patterns: ["*"]

  # The pre-commit that CI runs: .github/tools/pre-commit/requirements.in names the release and
  # requirements.txt is its lock (pip-compile, with hashes). Dependabot reads the pair and re-runs
  # pip-compile on it, so one pull request moves both. The tools folders are CI's, hence ci(deps). The one
  # direct dependency means a group never holds several updates; its name is two letters because the
  # longest title, `ci(deps): bump the ci group in /.github/tools/pre-commit with 99 updates`, is 72
  # characters (scripts/tests/commitlint-config.test.mjs holds every group to that).
  - package-ecosystem: pip
    directory: /.github/tools/pre-commit
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      ci:
        patterns: ["*"]

  # The commitlint that CI and the commit-msg hook run: .github/tools/commitlint/package.json pins it and
  # package-lock.json records its tree. Dependabot bumps both in one pull request, and the hook's copy of
  # the release follows by hand in that pull request (docs/CI-CD.md, "Pins"). Prefix and group name as in
  # the pip entry, for the same reason: `ci(deps): bump the ci group in /.github/tools/commitlint with 99
  # updates` is 72 characters.
  - package-ecosystem: npm
    directory: /.github/tools/commitlint
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      ci:
        patterns: ["*"]
