# Required checks for every pull request and for pushes to the integration branch and main.
# Pipeline graph, secrets and what runs where: docs/CI-CD.md. Every action is pinned to a full commit
# SHA (the comment names the release); jobs get the least privilege they need.
name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
      - feat/weather-aware-routing
  workflow_dispatch:

# One run per ref: a newer push cancels the superseded run (and with it the deployment behind it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same release as every other job (frontend/.nvmrc), so no job runs on a Node that
          # nobody pinned. This job only runs commitlint; the pin costs it nothing.
          node-version-file: frontend/.nvmrc
      # The release is the one in .github/tools/commitlint (docs/CI-CD.md, "Pins"), the manifest that
      # Dependabot reads; this job keeps no copy of it. The install is frozen: it takes what the lock
      # records, checks every package against its integrity hash, and fails when the lock and package.json
      # differ.
      - name: Install commitlint from its lockfile
        run: npm ci --prefix .github/tools/commitlint --ignore-scripts --no-audit --no-fund
      - name: Lint the title with the repository commitlint config
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          commitlint=.github/tools/commitlint/node_modules/.bin/commitlint
          "$commitlint" --version
          printf '%s\n' "$PR_TITLE" | "$commitlint" --config commitlint.config.mjs

  # The title is one line; a rebase-merge puts every commit of the pull request on the target branch,
  # so every commit is held to the same rules (docs/CI-CD.md, "Commit and hook checks").
  commit-lint:
    name: Commit messages (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so that every commit between the base and the head exists here.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The same release as every other job (frontend/.nvmrc); this job only runs commitlint.
          node-version-file: frontend/.nvmrc
      # The release is the one in .github/tools/commitlint (docs/CI-CD.md, "Pins"), the manifest that
      # Dependabot reads; this job keeps no copy of it. The install is frozen: it takes what the lock
      # records, checks every package against its integrity hash, and fails when the lock and package.json
      # differ.
      - name: Install commitlint from its lockfile
        run: npm ci --prefix .github/tools/commitlint --ignore-scripts --no-audit --no-fund
      - name: Lint every commit of the pull request with the repository commitlint config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commitlint=.github/tools/commitlint/node_modules/.bin/commitlint
          "$commitlint" --version
          "$commitlint" --config commitlint.config.mjs --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # The repository's own hooks (.pre-commit-config.yaml) on the files the pull request changes, so a
  # hook that was never installed on a contributor's machine still fails the pull request.
  pre-commit:
    name: Pre-commit hooks (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head of the pull request itself, not its merge with the base: the hooks must see the
          # files that the pull request proposes. The whole history, for the range and for gitleaks.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.github/tools/pre-commit/requirements.txt', '.pre-commit-config.yaml') }}
      # The release is the one in .github/tools/pre-commit (docs/CI-CD.md, "Pins"), the manifest that
      # Dependabot reads; this job keeps no copy of it. The install fails unless every package of the tree
      # is pinned in the lock and its files match the hashes recorded there.
      - name: Install pre-commit from its manifest
        run: |
          uv venv "$RUNNER_TEMP/pre-commit-venv"
          uv pip install --python "$RUNNER_TEMP/pre-commit-venv" --require-hashes -r .github/tools/pre-commit/requirements.txt
          echo "$RUNNER_TEMP/pre-commit-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pre-commit-venv/bin/pre-commit" --version
      # The gitleaks hook reads the staged changes and nothing is staged in a CI checkout, so the
      # hook is skipped below and this step scans the commits of the pull request instead: every
      # commit from the base to the head, with the gitleaks release that the hook pins. The
      # gitleaks-action does not do that: it asks the API for the first page (30) of the commits of
      # the pull request only, and its `--first-parent --no-merges` scan leaves out the commits that
      # a merged branch brought in.
      - name: Scan every commit of the pull request for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The release of the gitleaks hook in .pre-commit-config.yaml (a test holds the two equal)
          # and the sha256 of its Linux x64 archive, from the release's gitleaks_8.30.1_checksums.txt.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
      # check-added-large-files looks at the files staged as added, which in a CI checkout is none, so
      # it would pass whatever the pull request adds. Move HEAD back to where the branch left the base,
      # keeping every file: all the changes of the pull request are then staged, as in a commit.
      - name: Stage the changes of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git reset --soft "$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
      - name: Run the hooks on the files the pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # A hook is skipped only when a job of the CI gate already runs the same check on at least
          # the same files:
          #   ruff-check        backend job, step `uv run ruff check .` (the whole backend)
          #   ruff-format       backend job, step `uv run ruff format --check .` (the whole backend)
          #   css-module-types  frontend job, step `pnpm lint` (starts with cmk)
          #   prettier          frontend job, step `pnpm lint` (ends with `prettier --check .`, the whole tree)
          #   eslint            frontend job, step `pnpm lint` (`eslint .`, the whole tree)
          #   gitleaks          this job, step "Scan every commit of the pull request for secrets"
          SKIP: ruff-check,ruff-format,css-module-types,prettier,eslint,gitleaks
        run: pre-commit run --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure --color=never

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major version as the Supabase project (decision D-10): bump both together.
        image: postgres:17
        env:
          # Ephemeral container reachable only from this job's runner: trust auth mirrors the local
          # dev database and keeps any password literal out of the repository.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest --cov --cov-branch --cov-fail-under=100
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          { echo "### Backend coverage (line + branch)"; echo; uv run coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
      # Wall-clock budgets (10k assessments < 200 ms, checkpoints on a 20k-point path < 100 ms) run
      # in their own step, without coverage tracing (it slows Python several-fold); -rP prints the
      # measured times.
      - run: uv run pytest -m perf -rP

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - run: pnpm lint
      - run: pnpm tokens:check
      - run: pnpm typecheck
      - run: pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Frontend coverage"; echo
            echo "| Statements | Branches | Functions | Lines |"; echo "|---|---|---|---|"
            jq -r '.total | "| \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"' coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm build

  openapi:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: bash scripts/openapi.sh check

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: pixel-7, browser: chromium }
          - { project: iphone-14, browser: webkit }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the browser and its system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps "$BROWSER"
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
          # D-40: the firefox row runs headed inside Xvfb; install it if the image lacks it.
          if [ "$BROWSER" = "firefox" ] && ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          # D-41, D-42: scripts/e2e-xvfb.sh parks the Xvfb pointer with xdotool and logs the
          # server with xdpyinfo and xwininfo (package x11-utils). The runner image has none of
          # them, so install them here, after install-deps, which refreshed the apt lists.
          if [ "$BROWSER" = "firefox" ]; then
            if ! command -v xdotool > /dev/null; then
              sudo apt-get install -y --no-install-recommends xdotool
            fi
            if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
              sudo apt-get install -y --no-install-recommends x11-utils
            fi
            # xdotool opens the X display for every command, "version" included, so ask the package.
            dpkg-query -W -f='${Package} ${Version}\n' xdotool x11-utils
          fi
      - name: Run the end-to-end suite
        env:
          PROJECT: ${{ matrix.project }}
          # The R7 smoothness sweep (chromium only) writes what it measured here, pass or fail.
          PERF_EVIDENCE: ${{ github.workspace }}/frontend/perf-evidence/perf.json
        # D-40: Firefox runs its graphics probe at every start and the probe needs a display, so
        # the firefox row alone runs headed inside Xvfb (opt-in E2E_FIREFOX_XVFB=1, CI only), with
        # the pointer parked outside every window and watched by scripts/e2e-xvfb.sh (D-41).
        run: |
          if [ "$PROJECT" = "firefox" ]; then
            E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm e2e --project="$PROJECT"
          else
            pnpm e2e --project="$PROJECT"
          fi
      - name: Upload the R7 smoothness numbers
        if: ${{ !cancelled() && matrix.project == 'chromium' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-r7
          # perf.json and the gzipped Chrome trace of each sweep (D-39).
          path: frontend/perf-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the WebGL renderer each map test drew with (D-40)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgl-renderer-${{ matrix.project }}
          path: frontend/perf-evidence/webgl-renderer/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  vercel:
    name: Vercel config and build dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - name: Test the build tooling (100 % line and branch coverage of the pipeline scripts)
        run: pnpm run test:scripts
      - name: Validate vercel.json (official schema and project invariants)
        run: uv run --no-project --with jsonschema python scripts/check_vercel_config.py
      - name: Check that api/requirements.txt matches uv.lock
        run: |
          uv export --project backend --no-dev --frozen --no-emit-project -o api/requirements.txt
          git diff --exit-code -- api/requirements.txt
      - name: Install the Vercel CLI (pinned)
        run: npm install --global vercel@64.7.0
      - name: Build the deployment output (no Vercel account needed) and verify it
        run: bash scripts/vercel-build.sh dry-run
      # The build above is the only place where the CSP the browsers will enforce exists, so the
      # proof that the pages hydrate under it runs here: Chromium, Firefox and WebKit load the
      # prerendered pages and the kitchen sink from .vercel/output, served with its headers.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-csp
      - name: Install the browsers and their system dependencies
        working-directory: frontend
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox webkit
          else
            pnpm exec playwright install --with-deps chromium firefox webkit
          fi
          # D-40: csp-firefox runs headed inside Xvfb; install it if the image lacks it.
          if ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          # D-41, D-42: scripts/e2e-xvfb.sh parks the Xvfb pointer with xdotool and logs the server
          # with xdpyinfo and xwininfo (package x11-utils); the runner image has none of them.
          if ! command -v xdotool > /dev/null; then
            sudo apt-get install -y --no-install-recommends xdotool
          fi
          if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
            sudo apt-get install -y --no-install-recommends x11-utils
          fi
          # xdotool opens the X display for every command, "version" included, so ask the package.
          dpkg-query -W -f='${Package} ${Version}\n' xdotool x11-utils
      - name: Prove that the pages hydrate under the Content-Security-Policy of the build
        # D-40: csp-firefox runs headed inside Xvfb, its pointer parked and watched (D-41); the
        # config keeps csp-chromium and csp-webkit headless.
        run: E2E_FIREFOX_XVFB=1 bash scripts/e2e-xvfb.sh bash scripts/e2e-csp.sh
      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-csp
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # One required check that stands for the whole pipeline.
  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [pr-title, commit-lint, pre-commit, backend, frontend, openapi, e2e, vercel]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job passed (pr-title, commit-lint and pre-commit are skipped outside pull requests)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A required job ended as '$result'"; exit 1 ;;
            esac
          done

  deploy-preview:
    name: Preview deployment
    needs: [gate]
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
    secrets: inherit
    permissions:
      contents: read

  deploy-production:
    name: Production deployment
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
    permissions:
      contents: read

  # Lighthouse budgets (docs/CI-CD.md, lighthouse.yml). Exactly one of the next two jobs runs for any
  # event, and both report as "Lighthouse / Lighthouse budgets". They are deliberately not part of
  # the CI gate: pull requests into the integration branch only publish the scores until
  # LIGHTHOUSE_ENFORCE is switched on, and pull requests into main require this check on its own.
  # Pull requests into the integration branch and pushes: the local build, in parallel with CI.
  lighthouse:
    name: Lighthouse
    if: ${{ github.base_ref != 'main' }}
    uses: ./.github/workflows/lighthouse.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  # Pull requests into main: wait for the preview deployment and measure that when it exists (it
  # does once the Vercel secrets are set); otherwise the local build, exactly as above.
  lighthouse-preview:
    name: Lighthouse
    needs: [deploy-preview]
    if: ${{ !cancelled() && github.base_ref == 'main' }}
    uses: ./.github/workflows/lighthouse.yml
    with:
      url: ${{ needs.deploy-preview.outputs.url }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
