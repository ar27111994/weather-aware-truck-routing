# THROWAWAY PROBE (card R4F-E3, never merged), round 4. Rounds 1 to 3 showed, by the natural timing of
# the click, that the Firefox failure of the early-input test "tapping Plan routes changes nothing
# before hydration, and checks the form once after it" (K6) comes from the planner's styles arriving
# while the pointer is down, and that 3717c27 (the planner's styles linked in the prerendered page)
# stops it. This round makes the worst case happen on purpose, so that it does not depend on the
# timing of a runner: the stylesheets that the first input asks for are held back, the pointer goes
# down on Plan routes, the stylesheets are let through and drawn, and only then does the pointer go
# up (forced-*, ten runs each: base 791eadc, S 43447b5 = base + 3717c27, N e33c652 = head 33858ca
# without 3717c27, head 33858ca, tip cc3b983 = the live head of PR #33). The natural test runs ten
# times on four runners of the live tip (natural-tip), with the same recorder.
name: Probe early-input K6 round 4
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-e3-r4-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: ${{ matrix.variant }} ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: forced-base, replica: 1, ref: 791eadc50fa92ec0318624b62ec0559bc1136fc1, specs: "e2e/probe/k6-forced.spec.ts" }
          - { variant: forced-S, replica: 1, ref: 43447b5fdcf68f7a816d8ec8c47f8b66ad8719e5, specs: "e2e/probe/k6-forced.spec.ts" }
          - { variant: forced-N, replica: 1, ref: e33c652df7591e6b162409656f6f6a44d48e7cd4, specs: "e2e/probe/k6-forced.spec.ts" }
          - { variant: forced-head, replica: 1, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62, specs: "e2e/probe/k6-forced.spec.ts" }
          - { variant: forced-tip, replica: 1, ref: cc3b9836349c52d529da66bcb42fdaa3ba5fe197, specs: "e2e/probe/k6-forced.spec.ts" }
          - { variant: forced-tip, replica: 2, ref: cc3b9836349c52d529da66bcb42fdaa3ba5fe197, specs: "e2e/probe/k6-forced.spec.ts" }
          - { variant: natural-tip, replica: 1, ref: cc3b9836349c52d529da66bcb42fdaa3ba5fe197, specs: "e2e/early-input.spec.ts e2e/probe/k6-natural.spec.ts" }
          - { variant: natural-tip, replica: 2, ref: cc3b9836349c52d529da66bcb42fdaa3ba5fe197, specs: "e2e/early-input.spec.ts e2e/probe/k6-natural.spec.ts" }
          - { variant: natural-tip, replica: 3, ref: cc3b9836349c52d529da66bcb42fdaa3ba5fe197, specs: "e2e/early-input.spec.ts e2e/probe/k6-natural.spec.ts" }
          - { variant: natural-tip, replica: 4, ref: cc3b9836349c52d529da66bcb42fdaa3ba5fe197, specs: "e2e/early-input.spec.ts e2e/probe/k6-natural.spec.ts" }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: probe-src
          persist-credentials: false
      - name: Bring in the probe specs
        run: cp -r ../probe-src/frontend/e2e/probe e2e/probe
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox
      - name: Install Firefox and the display tools
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps firefox
          else
            pnpm exec playwright install --with-deps firefox
          fi
          if ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          if ! command -v xdotool > /dev/null; then
            sudo apt-get install -y --no-install-recommends xdotool
          fi
          if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
            sudo apt-get install -y --no-install-recommends x11-utils
          fi
      - name: The specs, ten times over, no retries
        env:
          SPECS: ${{ matrix.specs }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086
          E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test $SPECS --project=firefox --retries=0 --repeat-each=10 --reporter=list 2>&1 | tee probe-spec.log
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.variant }}-${{ matrix.replica }}
          path: frontend/probe-*.log
          if-no-files-found: warn
          retention-days: 7
