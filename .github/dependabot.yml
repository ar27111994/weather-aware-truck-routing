# Weekly, grouped dependency updates. Pull-request titles follow Conventional Commits so they pass
# the PR-title check (build(deps): ..., ci(deps): ...). A group of several updates is titled
# `<prefix>: bump the <group> group in <directory> with <n> updates` (or `across <k> directories`), so
# the group names are short: scripts/tests/commitlint-config.test.mjs works out the longest title of
# each group (two digits for <n> and <k>) and holds it to 72 characters. A title that names ONE
# dependency is as long as its name and is let past by commitlint.config.mjs.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    commit-message:
      prefix: build(deps)
    groups:
      py-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, frontend]
    commit-message:
      prefix: build(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  # Hook revisions of .pre-commit-config.yaml (ecosystem `pre-commit`, listed on docs.github.com under
  # "Dependabot supported ecosystems and repositories"). pre-commit itself is pinned in ci.yml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: build(deps)
    groups:
      pre-commit-hooks:
        patterns: ["*"]
