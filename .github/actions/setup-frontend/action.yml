# Shared by every job that needs the Node toolchain: pnpm (version from the packageManager field
# of the root package.json), Node with the pnpm store cached, and the locked frontend dependencies.
name: Set up frontend
description: Install pnpm and Node (store cached) and the locked frontend dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Install the locked frontend dependencies
      shell: bash
      working-directory: frontend
      run: pnpm install --frozen-lockfile
