# THROWAWAY PROBE (never merged): INT-NEW-1. Why did "shows the progress while the plan is made" in
# PlannerPage.test.tsx fail in CI run 40023320257 (head a3632b8) when it passed at 3c865fa?
# It runs on a push to a probe/fr-** branch only. It runs the whole unit suite with coverage, the way
# the Frontend job does, several times per job, on the exact tree of one commit, and keeps going
# after a red: the failing run prints the whole DOM (DEBUG_PRINT_LIMIT) instead of its first 7,000
# characters.
name: Probe FR
on:
  push:
    branches: ["probe/fr-**"]
permissions:
  contents: read
concurrency:
  group: probe-fr-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: Probe (${{ matrix.sha }} #${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sha: [a3632b87d096edab3a4ebe824cefaae690f01efc, 3c865fab8e2bb27dc2784fda9c6e21dece5ce8a7]
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use the exact tree of the commit under test
        working-directory: .
        run: git checkout --detach "${{ matrix.sha }}" && git log --oneline -1
      - uses: ./.github/actions/setup-frontend
      - name: The machine
        run: |
          nproc
          free -m | head -2
          node --version
          date -u
      - name: Run the whole suite four times, as the Frontend job does
        env:
          DEBUG_PRINT_LIMIT: "300000"
        run: |
          for i in 1 2 3 4; do
            echo "::group::run $i ($(date -u +%H:%M:%S))"
            pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary > "run-$i.log" 2>&1 || true
            grep -E "Test Files|Tests  |Duration|FAIL " "run-$i.log" | sed -E 's/\x1b\[[0-9;]*m//g' | head -12
            echo "::endgroup::"
          done
          echo "runs with a failing test:"
          grep -l "FAIL " run-*.log || echo "none"
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-fr-${{ matrix.sha }}-${{ matrix.shard }}
          path: frontend/run-*.log
          if-no-files-found: warn
          retention-days: 7
