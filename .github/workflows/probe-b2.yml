# THROWAWAY PROBE (never merged): R4F-B2 (D-51). Builds each listed commit with the exact Node of
# frontend/.nvmrc and measures the gzip level 6 import closures (measure.mjs: K7B's method, which K7B
# and SGN validated against CI to the byte). One job per distinct set of build-input files.
# It runs on a push to a probe/b2-** branch only.
name: Probe B2
on:
  push:
    branches: ["probe/b2-**"]
permissions:
  contents: read
concurrency:
  group: probe-b2-${{ github.sha }}
  cancel-in-progress: false
jobs:
  measure:
    name: measure ${{ matrix.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        sha:
          - d9c5a1e749153d002aefc4395c0b5fe2dc450ed8  # d9c5a1e
