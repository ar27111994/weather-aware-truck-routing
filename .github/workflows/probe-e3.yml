# THROWAWAY PROBE (card R4F-E3, never merged), round 2: which commit of PR #33 stops the Firefox
# failure of the early-input test "tapping Plan routes changes nothing before hydration, and checks
# the form once after it" (K6)? Round 1 (run 40060646350) measured the head at 0 failures in 80 runs
# against 9 in 20 on the base, and the recorder showed why the base fails: the planner's styles
# arrive while the pointer is down, the button moves, and the pointer goes up on another element.
# The prime suspect is 3717c27, which links the planner's styles in the prerendered page. One run,
# four trees, one factor (that commit), the base as the control:
#   base = 791eadc50fa92ec0318624b62ec0559bc1136fc1 (the base branch tip), 3 runners
#   S    = 43447b5fdcf68f7a816d8ec8c47f8b66ad8719e5 (the base plus 3717c27 alone), 4 runners
#   N    = e33c652df7591e6b162409656f6f6a44d48e7cd4 (the head 33858ca minus 3717c27, a revert), 4 runners
#   head = 33858ca4b79fb57a9abdcc89e139e841c65faf62 (the head of PR #33), 2 runners
# Each runner runs the spec and the recorder spec ten times over, with no retries, through
# scripts/e2e-xvfb.sh, as in round 1.
name: Probe early-input K6 round 2
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-e3-r2-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: ${{ matrix.variant }} ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: base, replica: 1, ref: 791eadc50fa92ec0318624b62ec0559bc1136fc1 }
          - { variant: base, replica: 2, ref: 791eadc50fa92ec0318624b62ec0559bc1136fc1 }
          - { variant: base, replica: 3, ref: 791eadc50fa92ec0318624b62ec0559bc1136fc1 }
          - { variant: S, replica: 1, ref: 43447b5fdcf68f7a816d8ec8c47f8b66ad8719e5 }
          - { variant: S, replica: 2, ref: 43447b5fdcf68f7a816d8ec8c47f8b66ad8719e5 }
          - { variant: S, replica: 3, ref: 43447b5fdcf68f7a816d8ec8c47f8b66ad8719e5 }
          - { variant: S, replica: 4, ref: 43447b5fdcf68f7a816d8ec8c47f8b66ad8719e5 }
          - { variant: N, replica: 1, ref: e33c652df7591e6b162409656f6f6a44d48e7cd4 }
          - { variant: N, replica: 2, ref: e33c652df7591e6b162409656f6f6a44d48e7cd4 }
          - { variant: N, replica: 3, ref: e33c652df7591e6b162409656f6f6a44d48e7cd4 }
          - { variant: N, replica: 4, ref: e33c652df7591e6b162409656f6f6a44d48e7cd4 }
          - { variant: head, replica: 1, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 2, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: probe-src
          persist-credentials: false
      - name: Bring in the tracer spec
        run: cp ../probe-src/frontend/e2e/probe-k6.spec.ts e2e/probe-k6.spec.ts
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox
      - name: Install Firefox and the display tools
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps firefox
          else
            pnpm exec playwright install --with-deps firefox
          fi
          if ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          if ! command -v xdotool > /dev/null; then
            sudo apt-get install -y --no-install-recommends xdotool
          fi
          if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
            sudo apt-get install -y --no-install-recommends x11-utils
          fi
      - name: The spec and the tracer, ten times over, no retries
        run: |
          set -o pipefail
          E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test e2e/early-input.spec.ts e2e/probe-k6.spec.ts --project=firefox --retries=0 --repeat-each=10 --reporter=list 2>&1 | tee probe-spec.log
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.variant }}-${{ matrix.replica }}
          path: frontend/probe-*.log
          if-no-files-found: warn
          retention-days: 7
