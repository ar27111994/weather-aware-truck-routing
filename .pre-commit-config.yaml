# Install once with: pre-commit install --install-hooks
# Hooks run the tools pinned by the lockfiles (uv, pnpm), so local results match CI.
# CI runs these hooks on the files that a pull request changes (the `pre-commit` job of ci.yml);
# docs/CI-CD.md says which of them it leaves to other jobs, and why.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Two kinds of file must keep their bytes, and so their lack of a final newline:
        # - shared/openapi.json is generated by `manage.py export_openapi_schema`, which writes none,
        #   and `scripts/openapi.sh check` compares the file with a fresh export byte for byte.
        # - The recorded provider responses (the .json files of backend/tests/fixtures/providers/routing
        #   and /weather, but not INDEX.json) are the upstream's bytes: routing/INDEX.json holds the size
        #   and the SHA-256 of each (stored_bytes, stored_sha256), weather/README.md says `sha256sum`
        #   reproduces them, and ReplayCatalog.read_bytes (backend/src/haulcast/providers/replay/
        #   catalog.py) serves them byte for byte. 39 have no final newline, as recorded.
        # The other hooks that could rewrite a recording (trailing-whitespace, mixed-line-ending) find
        # nothing in them; a hit there means a recording changed, and should fail.
        exclude: ^(shared/openapi\.json|backend/tests/fixtures/providers/(routing|weather)/(?!INDEX\.json$)[^/]+\.json)$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # pnpm writes frontend/pnpm-lock.yaml as two YAML documents; each one is still checked.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      # A Playwright golden is a full-page PNG; the largest tracked one is 1,306 KB (/design, 390 px
      # wide). It gets a limit of its own (the next entry) and every other file keeps 500 KB. The two
      # patterns split the files exactly: scripts/tests/ci-gates.test.mjs holds them to a table of paths.
      - id: check-added-large-files
        exclude: ^frontend/e2e/(?:.+/)?[^/]+-snapshots/.+\.png$
        args: [--maxkb=500]
      # What `playwright test --update-snapshots` writes (the goldens.yml workflow) and `toHaveScreenshot`
      # in frontend/e2e/**/*.spec.ts reads: a PNG in a *-snapshots folder below frontend/e2e. 2,048 KB is
      # 1.57 times the largest golden; scripts/tests/ci-gates.test.mjs has the derivation.
      - id: check-added-large-files
        name: check for added large files (Playwright goldens)
        alias: check-added-large-files-goldens
        files: ^frontend/e2e/(?:.+/)?[^/]+-snapshots/.+\.png$
        args: [--maxkb=2048]

  # Reads the staged changes only (`gitleaks git --staged`); CI scans every commit of the pull request.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # The three frontend hooks below work on the staged files; the whole tree is checked by
      # `pnpm lint` in the Frontend job of ci.yml. pre-commit names files from the repository root and
      # the tools work from frontend/, so frontend/scripts/precommit/ maps the names (see its tests).
      - id: css-module-types
        name: css module types (cmk)
        # eslint's type-aware rules read the types that cmk generates from the *.module.css files
        # (`pnpm lint` runs it first). Without them every `styles.x` is `string | undefined`. It stays
        # ahead of eslint: hooks run in the order of this file.
        entry: pnpm --dir frontend exec cmk
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: node frontend/scripts/precommit/run-in-frontend.ts prettier --write --ignore-unknown --
        language: system
        files: ^frontend/
      - id: eslint
        name: eslint
        entry: node frontend/scripts/precommit/run-in-frontend.ts eslint --no-warn-ignored --
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
      # The release is the one of .github/tools/commitlint, the manifest that Dependabot reads. A hook cannot
      # read a file for its release, so this copy follows it by hand, in the pull request that moves it:
      # scripts/tests/commitlint-config.test.mjs fails while the two differ.
      - id: commitlint
        name: commitlint (Conventional Commits)
        entry: npx --yes --package @commitlint/cli@21.2.4 commitlint --config commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]
