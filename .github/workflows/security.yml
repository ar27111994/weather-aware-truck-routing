# Security scanning: static analysis, secrets, dependency risk. Runs on every pull request, on pushes
# to the integration branch and main, and weekly (new advisories appear without any code change).
name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - feat/weather-aware-routing
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  # Every commit that the commit under test can reach, on every event of this workflow: a pull
  # request (the merge of its head into its base), a push to the integration branch or main, the
  # weekly run and a manual run. gitleaks/gitleaks-action did none of that: for a pull request it asks
  # the API for the first page (30) of the commits, for a push it scans the commits of the event, its
  # schedule runs on the default branch (main has no workflows yet), it runs gitleaks 8.24.3 unless
  # GITLEAKS_VERSION says otherwise, and it does not check the archive it downloads. Commits that only
  # another branch holds are left out on purpose: `--all` would turn every run red for a key planted
  # on a probe branch (docs/CI-CD.md, "Secret scans").
  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The release of the gitleaks hook in .pre-commit-config.yaml and of the `pre-commit` job of
      # ci.yml (scripts/tests/gitleaks-pin.test.mjs holds the three equal), and the sha256 of its Linux
      # x64 archive, from the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the pinned gitleaks release and check its sha256
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan every commit reachable from the checked-out commit
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --log-opts="--full-history HEAD" .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  audit:
    name: Dependency audit (pip-audit, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: pip-audit on the locked runtime dependencies
        run: |
          uv export --project backend --no-dev --frozen --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict
      - uses: ./.github/actions/setup-frontend
      - name: pnpm audit on the production dependencies (fail on high)
        run: pnpm --dir frontend audit --prod --audit-level high

  bandit:
    name: Python static analysis (bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: bandit (medium severity and confidence or higher)
        run: uvx bandit --recursive backend/src api --severity-level medium --confidence-level medium

  osv-scanner:
    name: OSV scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./
