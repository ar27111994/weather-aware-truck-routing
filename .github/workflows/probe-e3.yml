# THROWAWAY PROBE (card R4F-E3, never merged): does the Firefox failure of the early-input test
# "tapping Plan routes changes nothing before hydration, and checks the form once after it" (K6) still
# happen on the head of PR #33? Ten runners, one run, one control:
#   head = 33858ca4b79fb57a9abdcc89e139e841c65faf62 (the head of PR #33), 8 runners
#   base = 791eadc50fa92ec0318624b62ec0559bc1136fc1 (the base branch tip), 2 runners: the control
# Each runner runs the spec alone, ten times over, with no retries, through scripts/e2e-xvfb.sh,
# exactly as the probe of card T10-ST did (run 40056484879). The tracer spec (probe-k6.spec.ts, the
# same test with a recorder in the page) runs in the same invocation, so every runner also logs the
# events of ten runs of the same click, pass or fail.
name: Probe early-input K6
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-e3-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: ${{ matrix.variant }} ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: head, replica: 1, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 2, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 3, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 4, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 5, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 6, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 7, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: head, replica: 8, ref: 33858ca4b79fb57a9abdcc89e139e841c65faf62 }
          - { variant: base, replica: 1, ref: 791eadc50fa92ec0318624b62ec0559bc1136fc1 }
          - { variant: base, replica: 2, ref: 791eadc50fa92ec0318624b62ec0559bc1136fc1 }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: probe-src
          persist-credentials: false
      - name: Bring in the tracer spec
        run: cp ../probe-src/frontend/e2e/probe-k6.spec.ts e2e/probe-k6.spec.ts
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox
      - name: Install Firefox and the display tools
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps firefox
          else
            pnpm exec playwright install --with-deps firefox
          fi
          if ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          if ! command -v xdotool > /dev/null; then
            sudo apt-get install -y --no-install-recommends xdotool
          fi
          if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
            sudo apt-get install -y --no-install-recommends x11-utils
          fi
      - name: The spec and the tracer, ten times over, no retries
        run: |
          set -o pipefail
          E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test e2e/early-input.spec.ts e2e/probe-k6.spec.ts --project=firefox --retries=0 --repeat-each=10 --reporter=list 2>&1 | tee probe-spec.log
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.variant }}-${{ matrix.replica }}
          path: frontend/probe-*.log
          if-no-files-found: warn
          retention-days: 7
