# THROWAWAY PROBE (never merged): R4F-E2, client navigation shifts the layout by exactly 0 (R4-01 part 2).
# It runs on a push to a probe/** branch only: the specs the card names, on the five projects, with no
# retries and every test three times, and the baselines this tree makes (what the goldens would be).
name: Probe R4F E2
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: Probe (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: pixel-7, browser: chromium }
          - { project: iphone-14, browser: webkit }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the browser and its system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps "$BROWSER"
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
          if [ "$BROWSER" = "firefox" ] && ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          if [ "$BROWSER" = "firefox" ]; then
            if ! command -v xdotool > /dev/null; then
              sudo apt-get install -y --no-install-recommends xdotool
            fi
            if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
              sudo apt-get install -y --no-install-recommends x11-utils
            fi
          fi
      - name: Run the specs, with no retries, three times over
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          FILES="e2e/client-navigation.spec.ts e2e/early-input.spec.ts e2e/planner-styles.spec.ts e2e/states.spec.ts"
          if [ "$PROJECT" = "firefox" ]; then
            E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test $FILES --project="$PROJECT" --retries=0 --repeat-each=3 --reporter=list 2>&1 | tee "probe-$PROJECT.log"
          else
            pnpm exec playwright test $FILES --project="$PROJECT" --retries=0 --repeat-each=3 --reporter=list 2>&1 | tee "probe-$PROJECT.log"
          fi
      - name: The golden tests against the committed baselines (the ones that must fail, and only those)
        if: ${{ always() && matrix.project == 'chromium' }}
        run: |
          pnpm exec playwright test --project=chromium --grep @golden --retries=0 --reporter=list 2>&1 | tee probe-goldens-old.log || true
      - name: Make the baselines this tree draws
        if: ${{ always() && matrix.project == 'chromium' }}
        run: |
          pnpm exec playwright test --project=chromium --grep @golden --update-snapshots=all --retries=0 --reporter=list 2>&1 | tee probe-goldens-new.log || true
      - name: Upload the logs, the traces and the baselines
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.project }}
          path: |
            frontend/probe-*.log
            frontend/test-results/
            frontend/e2e/*.spec.ts-snapshots/*-linux.png
          if-no-files-found: ignore
