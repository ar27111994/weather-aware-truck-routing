# Weekly, grouped dependency updates. Pull-request titles follow Conventional Commits so they pass
# the PR-title check (build(deps): ..., ci(deps): ...).
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, frontend]
    commit-message:
      prefix: build(deps)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
