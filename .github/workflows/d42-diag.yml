# TEMPORARY (D-42 diagnostic). Lives only on the throwaway branch ci/d41-probe and its draft pull
# request; it is never merged. It answers one question with the real runner: why is the pointer back
# at the screen centre after a park (see scripts/d42-diag.sh)?
name: D-42 diagnostic (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    name: D-42 pointer park diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which tools the runner image already has
        run: |
          for tool in Xvfb xvfb-run xdotool xdpyinfo xwininfo python3; do
            printf '%s: ' "$tool"
            command -v "$tool" || echo missing
          done
          python3 -c 'import Xlib; print("python-xlib", Xlib.__version__)' 2>&1 || true
          dpkg-query -W -f='${Package} ${Version}\n' xvfb x11-utils xdotool python3-xlib 2>&1 || true
          echo "head=$(git rev-parse HEAD) run=${GITHUB_RUN_ID}"
      - name: Install what is missing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool x11-utils python3-xlib
          dpkg-query -W -f='${Package} ${Version}\n' xvfb x11-utils xdotool python3-xlib
      - name: Run the experiments, with and without -noreset
        run: bash scripts/d42-diag.sh d42
      - name: Upload the diagnostic logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d42-diag
          path: d42/
          retention-days: 30
