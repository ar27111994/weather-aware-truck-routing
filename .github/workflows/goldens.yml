# Makes the visual-golden baselines on the one platform that enforces them: the Linux runner of CI
# (docs/CI-CD.md, "Visual goldens"). It never commits anything: it uploads the PNGs as an artifact,
# and a person looks at them and commits them (frontend/e2e/<spec>.spec.ts-snapshots/).
#
#   - Pull request: add the label `update-goldens`. This works before this file reaches the default
#     branch, which a manual run cannot (GitHub only dispatches workflows of the default branch).
#   - Manual run: Actions > Update visual goldens > Run workflow.
#
# Run it again after any change that moves a pixel of /design; CI compares against what is committed.
name: Update visual goldens

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: goldens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Make the goldens
    # A label from a fork must not run this: the job executes the pull request's code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-goldens' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Make the baselines (the golden tests, in the one project that runs them)
        run: pnpm exec playwright test --project=chromium --grep @golden --update-snapshots=all
      - name: Upload the baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens-linux
          path: frontend/e2e/*.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14
