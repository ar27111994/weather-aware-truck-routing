# THROWAWAY PROBE (never merged): proof of the INT-NEW-1 fix. Card R4F-FR (t_a5772a6f).
#
# The code under test is the real fix commit, no instrumentation. Four kinds of job, one run:
#   fixed-single  PlannerPage.test.tsx alone, 25 fresh processes per job (the run that failed 25 of
#                 80 times in round 4 without the workaround). Needs 0 red.
#   control       the same loop with the ORIGINAL frontend/test/api.tsx put back (copied from
#                 .github/probe/api.original.tsx), so the same runner shows whether the race is still
#                 there today. Red runs are expected and are the point.
#   fixed-full    the whole unit suite with coverage, exactly as the CI Frontend job runs it,
#                 3 runs per job. Needs 0 red.
name: Probe FR 5
on:
  push:
    branches: ["probe/fr-**"]
permissions:
  contents: read
concurrency:
  group: probe-fr5-${{ github.sha }}
  cancel-in-progress: false
jobs:
  single:
    name: Probe ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fixed-single-a, control: "0" }
          - { name: fixed-single-b, control: "0" }
          - { name: fixed-single-c, control: "0" }
          - { name: fixed-single-d, control: "0" }
          - { name: control-single-a, control: "1" }
          - { name: control-single-b, control: "1" }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: The machine
        run: |
          nproc
          free -m | head -2
          node --version
          pnpm exec vitest --version
          pnpm ls msw @mswjs/interceptors jsdom vitest undici --depth 3 2>&1 | grep -E "msw|interceptors|jsdom|vitest|undici" | head -12
          node -p "'undici bundled in node: ' + process.versions.undici"
          date -u
      - name: Put the original test harness back (control jobs only)
        if: ${{ matrix.control == '1' }}
        run: cp ../.github/probe/api.original.tsx test/api.tsx
      - name: Run PlannerPage.test.tsx alone, 25 fresh processes, keep going after a red
        run: |
          failed=0
          for i in $(seq 1 25); do
            code=0
            pnpm exec vitest run app/features/planner/PlannerPage.test.tsx --coverage --coverage.reporter=text-summary --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 > "run-$i.log" 2>&1 || code=$?
            if [ "$code" -ne 0 ]; then
              failed=$((failed + 1))
              echo "::group::RUN $i FAILED, exit $code ($(date -u +%H:%M:%S))"
              grep -E "FAIL |AssertionError|ENOTFOUND|reached the mock server" "run-$i.log" | cut -c1-240 | head -12
              echo "::endgroup::"
            fi
          done
          echo "RESULT ${{ matrix.name }}: $failed of 25 runs failed"
          if [ "${{ matrix.control }}" = "0" ]; then test "$failed" -eq 0; fi
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-fr5-${{ matrix.name }}
          path: frontend/run-*.log
          if-no-files-found: warn
          retention-days: 7
  full:
    name: Probe ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [fixed-full-a, fixed-full-b, fixed-full-c, fixed-full-d]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: The whole unit suite with coverage, 3 runs as CI runs it, keep going after a red
        run: |
          failed=0
          for i in 1 2 3; do
            code=0
            pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary > "run-$i.log" 2>&1 || code=$?
            echo "run $i: exit $code ($(grep -E '^ +Tests ' "run-$i.log" | tr -s ' '))"
            if [ "$code" -ne 0 ]; then
              failed=$((failed + 1))
              echo "::group::RUN $i FAILED, exit $code"
              grep -E "FAIL |AssertionError|ENOTFOUND|reached the mock server|ERROR: Coverage" "run-$i.log" | cut -c1-240 | head -20
              echo "::endgroup::"
            fi
          done
          echo "RESULT ${{ matrix.name }}: $failed of 3 runs failed"
          test "$failed" -eq 0
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-fr5-${{ matrix.name }}
          path: frontend/run-*.log
          if-no-files-found: warn
          retention-days: 7
