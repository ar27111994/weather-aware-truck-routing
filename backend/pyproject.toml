[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "haulcast"
dynamic = ["version"]
description = "Haulcast backend: Django + Django Ninja API for weather-aware truck routing."
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "Ahmed Rehan" }]
dependencies = [
  "django>=5.2,<5.3",
  "django-ninja>=1.4",
  "pydantic>=2.11,<3",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "jsonschema>=4.25",
  "tzfpy>=2.1.1",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-django>=4.11",
  "pytest-cov>=6.2",
  "hypothesis>=6.135",
  "syrupy>=4.9",
  "respx>=0.22",
  "ruff>=0.12",
  "mypy>=1.17",
  "django-stubs[compatible-mypy]>=5.2",
  "types-jsonschema>=4.25",
]

[tool.hatch.version]
path = "src/haulcast/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haulcast"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",    # per-file copyright headers are noise: LICENSE covers the whole repository
  "EM",     # exception-message rules: inline messages on typed exceptions are fine and clearer
  "TRY003", # same reason: long messages belong at the raise site
  "COM812", # formatter conflict (trailing commas are the formatter's job)
  "ISC001", # formatter conflict (implicit string concatenation)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Django Ninja only recognises the request parameter by its exact name, so operations must declare
# `request` even when they do not read it.
"src/haulcast/api/**" = ["ARG001"]
# Migrations are Django's declarative idiom: `dependencies` / `operations` are class-level lists
# by contract, and the generated `Migration` class needs no docstring.
"src/haulcast/store/migrations/*.py" = ["D100", "D101", "RUF012"]
# Tests: asserts are the point, magic values are the data, docstrings add noise, and the throwaway
# credentials in fixtures are fake by construction (S105/S106: nothing here ever authenticates).
"tests/**" = ["S101", "S105", "S106", "PLR2004", "D"]
# The probe URLconf's views must accept the request argument Django and Ninja always pass.
"tests/api/probe_urls.py" = ["ARG001"]
# Fixtures that exist for their side effect (a migrated database) are requested by argument: that is
# how pytest orders fixtures, and the argument is deliberately never read.
"tests/conftest.py" = ["ARG001"]
# Django settings-module idiom: the test settings extend the production settings by star import, and
# carry a fixed throwaway SECRET_KEY on purpose (it never leaves the test-suite).
"tests/settings.py" = ["F403", "F405"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["mypy_django_plugin.main"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.django-stubs]
django_settings_module = "haulcast.config.settings"

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
# Performance budgets are wall-clock assertions, so they never run under coverage tracing (which
# slows Python several-fold): the default run deselects them and CI runs them in their own step
# with `uv run pytest -m perf`. Selecting `-m perf` on the command line overrides this default.
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not perf"]
markers = ["perf: wall-clock performance budget (run without coverage: `uv run pytest -m perf`)"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["haulcast"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
