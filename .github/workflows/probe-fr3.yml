# THROWAWAY PROBE (never merged): INT-NEW-1, round 3. See the card R4F-FR (t_a5772a6f), comment 500.
# Facts so far: on the head tree, the plan request of "shows the progress while the plan is made" is
# not intercepted by MSW in about 1 of 3 full-suite runs: it reaches real DNS (getaddrinfo ENOTFOUND
# api.test) and ends in the generic error panel. The base tree never does it (0 of 12).
# Round 3 asks three things:
#   close-full: does closing every connection after its response (no socket reuse) stop it?
#   plain-full: tracing only (MSW request:start per request, idle age of the previous response).
#   plain-single: does the file alone, in 20 fresh processes, show it (is the full suite needed)?
name: Probe FR 3
on:
  push:
    branches: ["probe/fr-**"]
permissions:
  contents: read
concurrency:
  group: probe-fr3-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: Probe ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: close-full-1, mode: full, close: "1" }
          - { name: close-full-2, mode: full, close: "1" }
          - { name: close-full-3, mode: full, close: "1" }
          - { name: plain-full-1, mode: full, close: "0" }
          - { name: plain-full-2, mode: full, close: "0" }
          - { name: plain-full-3, mode: full, close: "0" }
          - { name: plain-single-1, mode: single, close: "0" }
          - { name: plain-single-2, mode: single, close: "0" }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: The machine
        run: |
          nproc
          free -m | head -2
          node --version
          date -u
      - name: Run the tests, keep going after a red
        env:
          DEBUG_PRINT_LIMIT: "300000"
          PROBE_CLOSE: ${{ matrix.close }}
          MODE: ${{ matrix.mode }}
        run: |
          if [ "$MODE" = "full" ]; then RUNS=3; else RUNS=20; fi
          failed=0
          for i in $(seq 1 "$RUNS"); do
            if [ "$MODE" = "full" ]; then
              pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary > "run-$i.log" 2>&1 || true
            else
              pnpm exec vitest run app/features/planner/PlannerPage.test.tsx --coverage --coverage.reporter=text-summary --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 > "run-$i.log" 2>&1 || true
            fi
            if grep -q "FAIL " "run-$i.log"; then
              failed=$((failed + 1))
              echo "::group::RUN $i FAILED ($(date -u +%H:%M:%S))"
              grep "^\[probe\] PlannerPage.test.tsx" "run-$i.log" | grep -E "fetch#|MSW start|REJECTED|timeline|progress|ABORT|FIRED" | cut -c1-230 | tail -120
              echo "::endgroup::"
            else
              echo "run $i ok ($(date -u +%H:%M:%S))"
            fi
          done
          echo "RESULT $MODE close=$PROBE_CLOSE: $failed of $RUNS runs failed"
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-fr-round3-${{ matrix.name }}
          path: frontend/run-*.log
          if-no-files-found: warn
          retention-days: 7
