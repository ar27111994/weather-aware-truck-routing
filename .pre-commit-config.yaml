# Install once with: pre-commit install --install-hooks
# Hooks run the tools pinned by the lockfiles (uv, pnpm), so local results match CI.
# CI runs these hooks on the files that a pull request changes (the `pre-commit` job of ci.yml);
# docs/CI-CD.md says which of them it leaves to other jobs, and why.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Generated by `manage.py export_openapi_schema`, which writes no final newline, and
        # `scripts/openapi.sh check` compares the file with a fresh export byte for byte.
        exclude: ^shared/openapi\.json$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # pnpm writes frontend/pnpm-lock.yaml as two YAML documents; each one is still checked.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Reads the staged changes only (`gitleaks git --staged`); CI scans every commit of the pull request.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # The three frontend hooks below work on the staged files; the whole tree is checked by
      # `pnpm lint` in the Frontend job of ci.yml. pre-commit names files from the repository root and
      # the tools work from frontend/, so frontend/scripts/precommit/ maps the names (see its tests).
      - id: css-module-types
        name: css module types (cmk)
        # eslint's type-aware rules read the types that cmk generates from the *.module.css files
        # (`pnpm lint` runs it first). Without them every `styles.x` is `string | undefined`. It stays
        # ahead of eslint: hooks run in the order of this file.
        entry: pnpm --dir frontend exec cmk
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: node frontend/scripts/precommit/run-in-frontend.ts prettier --write --ignore-unknown --
        language: system
        files: ^frontend/
      - id: eslint
        name: eslint
        entry: node frontend/scripts/precommit/run-in-frontend.ts eslint --no-warn-ignored --
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
      - id: commitlint
        name: commitlint (Conventional Commits)
        entry: npx --yes --package @commitlint/cli@21.2.4 commitlint --config commitlint.config.mjs --edit
        language: system
        stages: [commit-msg]
