# THROWAWAY PROBE (card R4F-CL, never merged). On a push to a probe/** branch only, it runs the tests of
# e2e/early-input.spec.ts on the five Playwright projects of the CI, with one worker and no retries
# (the D-46 3.4 teeth, finding R4-18):
#   probe/cl-2 = PR #33's head 82385eb as it is, plus this file: every test must pass. It also reads
#              reflow.spec.ts and bottom-sheet-handle.spec.ts test by test, with no retries.
#   probe/cl-1 = probe/cl-2 with the handoff removed (claim() hands over nothing): the tests that need
#              the handoff must fail.
#   probe/cl-3 = probe/cl-2 with the shared link's fill-in removed: the shared-link test must fail.
name: Probe CL
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-cl-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: Probe (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: pixel-7, browser: chromium }
          - { project: iphone-14, browser: webkit }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the browser and its system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps "$BROWSER"
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
          if [ "$BROWSER" = "firefox" ] && ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          if [ "$BROWSER" = "firefox" ]; then
            if ! command -v xdotool > /dev/null; then
              sudo apt-get install -y --no-install-recommends xdotool
            fi
            if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
              sudo apt-get install -y --no-install-recommends x11-utils
            fi
          fi
      - name: Show what is under test
        run: |
          git log --oneline -3
          sha256sum app/features/planner/early-input.ts app/features/planner/PlannerApp.tsx app/features/planner/intent.ts app/features/planner/usePlannerForm.ts
      - name: Run e2e/early-input.spec.ts, one worker, no retries
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          FILES="e2e/early-input.spec.ts"
          if [ "$PROJECT" = "firefox" ]; then
            E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test $FILES --project="$PROJECT" --workers=1 --retries=0 --reporter=list 2>&1 | tee "probe-$PROJECT-teeth.log"
          else
            pnpm exec playwright test $FILES --project="$PROJECT" --workers=1 --retries=0 --reporter=list 2>&1 | tee "probe-$PROJECT-teeth.log"
          fi
      - name: Read reflow and the bottom sheet handle, test by test, no retries
        if: ${{ github.ref_name == 'probe/cl-2' && !cancelled() }}
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          FILES="e2e/reflow.spec.ts e2e/bottom-sheet-handle.spec.ts"
          if [ "$PROJECT" = "firefox" ]; then
            E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test $FILES --project="$PROJECT" --retries=0 --reporter=list 2>&1 | tee "probe-$PROJECT-specs.log"
          else
            pnpm exec playwright test $FILES --project="$PROJECT" --retries=0 --reporter=list 2>&1 | tee "probe-$PROJECT-specs.log"
          fi
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-cl-${{ github.run_id }}-${{ matrix.project }}
          path: frontend/probe-*.log
          if-no-files-found: warn
          retention-days: 14
