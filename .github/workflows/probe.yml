# THROWAWAY PROBE (never merged): R4F-RT, e2e/seo.spec.ts with and without VITE_SITE_URL (R4-15).
# It runs on a push to a probe/** branch only.
name: Probe RT
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: Probe (${{ matrix.project }}, origin ${{ matrix.tag }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, tag: none, origin: none }
          - { project: chromium, browser: chromium, tag: set, origin: "https://haulcast.example" }
          - { project: firefox, browser: firefox, tag: none, origin: none }
          - { project: webkit, browser: webkit, tag: none, origin: none }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the browser and its system dependencies
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps "$BROWSER"
          else
            pnpm exec playwright install --with-deps "$BROWSER"
          fi
          if [ "$BROWSER" = "firefox" ] && ! command -v xvfb-run > /dev/null; then
            sudo apt-get install -y xvfb
          fi
          if [ "$BROWSER" = "firefox" ]; then
            if ! command -v xdotool > /dev/null; then
              sudo apt-get install -y --no-install-recommends xdotool
            fi
            if ! command -v xdpyinfo > /dev/null || ! command -v xwininfo > /dev/null; then
              sudo apt-get install -y --no-install-recommends x11-utils
            fi
          fi
      - name: Run e2e/seo.spec.ts with no retries
        env:
          PROJECT: ${{ matrix.project }}
          TAG: ${{ matrix.tag }}
          ORIGIN: ${{ matrix.origin }}
        run: |
          set -o pipefail
          if [ "$ORIGIN" != "none" ]; then export VITE_SITE_URL="$ORIGIN"; fi
          FILES="e2e/seo.spec.ts"
          if [ "$PROJECT" = "firefox" ]; then
            E2E_FIREFOX_XVFB=1 bash ../scripts/e2e-xvfb.sh pnpm exec playwright test $FILES --project="$PROJECT" --retries=0 --reporter=list 2>&1 | tee "probe-$PROJECT-$TAG.log"
          else
            pnpm exec playwright test $FILES --project="$PROJECT" --retries=0 --reporter=list 2>&1 | tee "probe-$PROJECT-$TAG.log"
          fi
      - name: Upload the log and the traces
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.project }}-${{ matrix.tag }}
          path: |
            frontend/probe-*.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
