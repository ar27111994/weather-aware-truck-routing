# THROWAWAY PROBE (never merged): INT-NEW-1. Why did "shows the progress while the plan is made" in
# PlannerPage.test.tsx fail in CI run 40023320257 (head a3632b8) when it passed at 3c865fa?
# Round 1 (run 40037727264) reproduced it on the head tree: 4 of 12 full-suite runs failed with the
# plan request ending in the generic error panel; the base tree failed 0 of 12.
# Round 2: the head tree plus test-only instrumentation (test/probe.ts, the fetch wrapper in
# test/api.tsx, an ApiError log, a per-20 ms timeline in the progress test) that says which error
# the plan request ended with, who aborted it and when. It runs on a push to a probe/fr-** branch
# only, runs the whole unit suite with coverage as the Frontend job does, and keeps going after a red.
name: Probe FR 2
on:
  push:
    branches: ["probe/fr-**"]
permissions:
  contents: read
concurrency:
  group: probe-fr2-${{ github.sha }}
  cancel-in-progress: false
jobs:
  probe:
    name: Probe (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: The machine
        run: |
          nproc
          free -m | head -2
          node --version
          date -u
      - name: Run the whole suite three times, as the Frontend job does
        env:
          DEBUG_PRINT_LIMIT: "300000"
        run: |
          for i in 1 2 3; do
            echo "::group::run $i ($(date -u +%H:%M:%S))"
            pnpm test:coverage --coverage.reporter=text --coverage.reporter=json-summary > "run-$i.log" 2>&1 || true
            grep -E "Test Files|     Tests  |   Duration" "run-$i.log" | sed -E 's/\x1b\[[0-9;]*m//g'
            if grep -q "FAIL " "run-$i.log"; then
              echo "RUN $i FAILED; the probe lines of the progress test:"
              grep "hen the answer, and puts the plan in the address" "run-$i.log" | grep "^\[probe\]" | cut -c1-2400
            fi
            echo "::endgroup::"
          done
          echo "runs with a failing test:"
          grep -l "FAIL " run-*.log || echo "none"
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-fr-round2-${{ matrix.shard }}
          path: frontend/run-*.log
          if-no-files-found: warn
          retention-days: 7
